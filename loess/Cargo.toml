[package]
name = "loess"
version = "0.2.5"
authors = ["Tamme Schichler <tamme@schichler.dev>"]
edition = "2024"
rust-version = "1.86"
description = "Small grammar- and parser-generator for proc macros that provides great UX."
# documentation intentionally defaulted
readme = "../README.md"
# homepage
repository = "https://github.com/Tamschi/loess"
license = "MIT OR Apache-2.0"
keywords = ["proc-macro", "grammar", "parser", "generator", "dsl"]
categories = ["development-tools::procedural-macro-helpers"]

publish = false

[features]

[dependencies]
never-say-never = "6.6.666"
proc-macro2 = { version = "1.0.34", features = ["span-locations"] }

[package.metadata.cargo-semver-checks.lints]
workspace = true
