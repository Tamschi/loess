[package]
name = "loess"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
proc-macro2 = "1.0.34"
quote = "1.0.40"

# Private dependency! Do not implement Loess traits on Syn types and vice versa.
syn = { version = "2.0.100", default-features = false, features = [
    "clone-impls",
    "full",
    "parsing",
    "printing",
] }
